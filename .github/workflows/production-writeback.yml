name: Publisher · Reconcile verified production writeback
on:
  workflow_run:
    workflows: ["Deploy · Cloudflare production"]
    types: [completed]
permissions:
  contents: read
concurrency:
  group: techblogtip-release-writeback
  cancel-in-progress: false
jobs:
  reconcile:
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.repository.full_name == 'duykhang68/techblogtip' &&
          github.event.workflow_run.event == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    environment: techblogtip-production
    timeout-minutes: 15
    env:
      TBT_PRODUCTION_SYNC_TOKEN: ${{ secrets.TBT_PRODUCTION_SYNC_TOKEN }}
      PRODUCTION_RUN_ID: ${{ github.event.workflow_run.id }}
      PRODUCTION_RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
      - name: Trigger locked per-article release verification and M:O reconciliation
        run: node scripts/publisher/reconcile-from-actions.mjs
