name: Deploy · TechBlogTip Publisher DEV (manual)
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Confirm deploying the separate authenticated publisher dev Worker"
        type: choice
        required: true
        options:
          - deploy-dev-only
permissions:
  contents: read
concurrency:
  group: techblogtip-publisher-dev
  cancel-in-progress: false
jobs:
  deploy:
    if: ${{ github.ref == 'refs/heads/main' && inputs.confirm == 'deploy-dev-only' }}
    name: Manual deploy · secret gate · exact SHA verify
    environment: techblogtip-publisher-dev
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || 'd2228e3f75bc47eff64442ad8a225f85' }}
      TBT_GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.TBT_GOOGLE_OAUTH_CLIENT_ID }}
      TBT_ALLOWED_EDITORS: ${{ secrets.TBT_ALLOWED_EDITORS }}
      TBT_SHEETS_SPREADSHEET_ID: ${{ secrets.TBT_SHEETS_SPREADSHEET_ID }}
      TBT_SHEETS_GID: ${{ secrets.TBT_SHEETS_GID }}
      TBT_GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.TBT_GOOGLE_SERVICE_ACCOUNT_JSON }}
      TBT_GITHUB_PUBLISHER_TOKEN: ${{ secrets.TBT_GITHUB_PUBLISHER_TOKEN }}
      TBT_PRODUCTION_SITE_URL: https://duykhang68.github.io/techblogtip/
      TBT_PRODUCTION_SYNC_TOKEN: ${{ secrets.TBT_PRODUCTION_SYNC_TOKEN }}
      PUBLISHER_URL: https://techblogtip-publisher-dev.tamsudev-com.workers.dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
      - name: Confirm deploy credentials and exact SHA
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::CLOUDFLARE_API_TOKEN secret missing"; exit 1; }
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA" || { echo "::error::Checkout SHA mismatch"; exit 1; }
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify Publisher tests
        run: npm run publisher:test
      - name: Build and validate Worker
        working-directory: workers/publisher
        run: npx cf build
      - name: Validate secret bindings without exposing values
        id: bindings
        run: node scripts/publisher/create-deploy-secrets.mjs
      - name: Deploy only publisher-dev Worker
        working-directory: workers/publisher
        env:
          BINDINGS_FILE: ${{ steps.bindings.outputs.file }}
        run: npx cf deploy --no-provision --secrets-file "$BINDINGS_FILE" --message "Publisher dev $GITHUB_SHA"
      - name: Remove ephemeral secret file
        if: always()
        env:
          BINDINGS_FILE: ${{ steps.bindings.outputs.file }}
        run: |
          if [ -n "$BINDINGS_FILE" ] && [ -f "$BINDINGS_FILE" ]; then
            rm -f "$BINDINGS_FILE"
            rmdir "$(dirname "$BINDINGS_FILE")" || true
          fi
      - name: Verify public Publisher DEV exact SHA and anonymous denial
        run: node scripts/publisher/verify-deploy.mjs
