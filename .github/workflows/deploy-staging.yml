name: Deploy · Cloudflare staging
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: techblogtip-staging-deploy
  cancel-in-progress: false
jobs:
  deploy:
    name: Exact SHA · Cloudflare · Verify public
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SITE_URL: https://techblogtip-staging.tamsudev-com.workers.dev/
      PUBLIC_INDEXABLE: "false"
      STAGING_URL: https://techblogtip-staging.tamsudev-com.workers.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Reject missing Cloudflare credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID" || {
            echo "::error::Configure Cloudflare staging secrets before deploying"
            exit 1
          }
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate exact source, build
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          npm run quality
      - name: Deploy ONLY to staging
        run: npx cf deploy ./dist --message "TechBlogTip staging $GITHUB_SHA"
      - name: Verify actual public release
        run: node scripts/verify-deploy.mjs
