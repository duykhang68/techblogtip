name: Deploy · GitHub Pages production
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: techblogtip-github-pages-release
  cancel-in-progress: false
jobs:
  build:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SOURCE_SHA: ${{ github.sha }}
      SITE_URL: https://duykhang68.github.io/techblogtip/
      DEPLOY_TARGET: github-pages
      PUBLIC_INDEXABLE: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Verify main checkout
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Quality, content tests, Pages base-path and exact release SHA
        run: npm run quality
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: ./dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    env:
      SOURCE_SHA: ${{ github.sha }}
      PRODUCTION_URL: https://duykhang68.github.io/techblogtip/
      TBT_PRODUCTION_SYNC_TOKEN: ${{ secrets.TBT_PRODUCTION_SYNC_TOKEN }}
      PRODUCTION_RUN_ID: ${{ github.run_id }}
      PRODUCTION_RELEASE_SHA: ${{ github.sha }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      - name: Verify live GitHub Pages release SHA, canonical and public robots
        run: node scripts/publisher/verify-production-deploy.mjs
      - name: Reconcile verified Sheets M:O (when service secret is provisioned)
        if: ${{ env.TBT_PRODUCTION_SYNC_TOKEN != '' }}
        run: node scripts/publisher/reconcile-from-actions.mjs
      - name: Explain manual recovery until sync token is available
        if: ${{ env.TBT_PRODUCTION_SYNC_TOKEN == '' }}
        run: echo '::notice::Pages deployed and verified. Configure TBT_PRODUCTION_SYNC_TOKEN in the github-pages environment and Publisher DEV to enable automatic M:O writeback.'
