name: Deploy · GitHub Pages production
# IMPORTANT: Publisher Worker validates workflow_runs.name exactly for M:O writeback.
# Keep main branch title equal to workflow name; only non-main skips get a custom title.
run-name: >-
  ${{ github.ref == 'refs/heads/main'
      && 'Deploy · GitHub Pages production'
      || format('SKIP · production requires main (got {0})', github.ref_name) }}
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: techblogtip-github-pages-release
  cancel-in-progress: false
jobs:
  build:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SOURCE_SHA: ${{ github.sha }}
      SITE_URL: https://duykhang68.github.io/techblogtip/
      DEPLOY_TARGET: github-pages
      PUBLIC_INDEXABLE: "true"
      PUBLIC_RESUME_GOOGLE_CLIENT_ID: ${{ vars.PUBLIC_RESUME_GOOGLE_CLIENT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Verify main checkout
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - name: Verify Resume OAuth configuration (never print Client ID)
        run: |
          node -e "const id=(process.env.PUBLIC_RESUME_GOOGLE_CLIENT_ID||'').trim(); if(!/^[A-Za-z0-9._-]+\\.apps\\.googleusercontent\\.com$/.test(id)){console.error('::error title=Resume OAuth missing::Set PUBLIC_RESUME_GOOGLE_CLIENT_ID as an Actions repository variable.');process.exit(1)}console.log('Resume OAuth configured: yes (value hidden).')"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Quality, content tests, Pages base-path and exact release SHA
        run: npm run quality
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: ./dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    env:
      SOURCE_SHA: ${{ github.sha }}
      PRODUCTION_URL: https://duykhang68.github.io/techblogtip/
      TBT_PRODUCTION_SYNC_TOKEN: ${{ secrets.TBT_PRODUCTION_SYNC_TOKEN }}
      PRODUCTION_RUN_ID: ${{ github.run_id }}
      PRODUCTION_RELEASE_SHA: ${{ github.sha }}
    steps:
      - name: Checkout exact source SHA for verification scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify deploy job exact checkout SHA
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      - name: Verify live GitHub Pages release SHA, canonical and public robots
        run: node scripts/publisher/verify-production-deploy.mjs
      - name: Reconcile verified Sheets M:O (when service secret is provisioned)
        if: ${{ env.TBT_PRODUCTION_SYNC_TOKEN != '' }}
        run: node scripts/publisher/reconcile-from-actions.mjs
      - name: Explain skipped Sheets writeback when sync token is missing
        if: ${{ env.TBT_PRODUCTION_SYNC_TOKEN == '' }}
        run: |
          echo '::notice title=Sheets writeback skipped::Pages verified, but TBT_PRODUCTION_SYNC_TOKEN is missing. Configure it in the github-pages environment and Publisher DEV to enable M:O writeback.'
          {
            echo '### SKIP · Sheets production writeback'
            echo ''
            echo 'Reason: TBT_PRODUCTION_SYNC_TOKEN is not configured for github-pages.'
            echo 'GitHub Pages deployment and live SHA verification remain separate from Sheets writeback.'
          } >> "$GITHUB_STEP_SUMMARY"
