name: Deploy · GitHub Pages production
run-name: >-
  ${{ github.ref == 'refs/heads/main'
      && 'Deploy · GitHub Pages production'
      || format('SKIP · production requires main (got {0})', github.ref_name) }}
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: techblogtip-github-pages-release
  cancel-in-progress: false
jobs:
  build:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SOURCE_SHA: ${{ github.sha }}
      SITE_URL: https://duykhang68.github.io/techblogtip/
      DEPLOY_TARGET: github-pages
      PUBLIC_INDEXABLE: "true"
      PUBLIC_GSC_VERIFICATION: ${{ vars.PUBLIC_GSC_VERIFICATION }}
      # Korea CV reuses the *existing Resume Studio Web OAuth client* (public ID).
      # Never change Publisher's separate TBT_GOOGLE_OAUTH_CLIENT_ID authentication.
      PUBLIC_KOREA_CV_GOOGLE_CLIENT_ID: 86180355982-ucstas5q9h5j10hedc1lruo3pg4v8h5f.apps.googleusercontent.com
      # Fail closed until operator sets the reviewed private Korea CV API origin.
      PUBLIC_KOREA_CV_API_URL: ${{ vars.PUBLIC_KOREA_CV_API_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Verify main checkout
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Quality, content tests, Pages base-path and exact release SHA
        run: npm run quality
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: ./dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    env:
      SOURCE_SHA: ${{ github.sha }}
      PRODUCTION_URL: https://duykhang68.github.io/techblogtip/
    steps:
      - name: Checkout exact source SHA for verification scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify deploy job exact checkout SHA
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      - name: Verify live GitHub Pages release SHA, canonical and public robots
        run: node scripts/verify-production-deploy.mjs
      - name: Verify live sitemap, robots, canonical and sampled articles
        run: node scripts/verify-live-sitemap.mjs
      - name: Inspect Google indexing after verified production deploy (read-only)
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          GSC_SITE_URL: ${{ vars.GSC_SITE_URL }}
        run: node scripts/monitor-google-index.mjs
