name: Font A/B Mobile Benchmark

on:
  pull_request:
    paths:
      - 'scripts/font-ab-mobile.mjs'
      - '.github/workflows/font-ab-mobile.yml'
  workflow_dispatch:
    inputs:
      url:
        description: 'Target deployed page (default TechBlogTip homepage)'
        required: false
        type: string
      runs:
        description: 'Cold-cache runs per font (1-10)'
        required: false
        default: '3'
        type: string

permissions:
  contents: read

concurrency:
  group: font-ab-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  measure:
    name: Mobile cold-cache font comparison
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      FONT_AB_URL: ${{ inputs.url || 'https://duykhang68.github.io/techblogtip/' }}
      FONT_AB_RUNS: ${{ inputs.runs || '3' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: npm install --no-package-lock --no-audit --no-fund
      - name: Install pinned Chromium for Playwright Core
        run: npx playwright-core install --with-deps chromium
      - name: Run mobile A/B (production site remains unchanged)
        run: node scripts/font-ab-mobile.mjs
      - name: Publish measurement summary
        if: always()
        run: |
          if [ -f artifacts/font-ab/report.md ]; then
            cat artifacts/font-ab/report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Font comparison did not produce a report; inspect logs.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: font-ab-mobile-${{ github.run_id }}
          path: artifacts/font-ab/
          if-no-files-found: warn
          retention-days: 30
