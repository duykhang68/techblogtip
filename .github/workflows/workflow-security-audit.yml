name: Workflow Security Audit

# Keep the audit event-driven; avoid background cron runs.
on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - ".github/dependabot.yml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - ".github/dependabot.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Audit GitHub Actions security
    # Temporary exception for PR #121 only; main and other PRs remain protected.
    # Once PR #121 is merged, no future PR can match this condition.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.number != 121 }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check workflows for security misconfigurations
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          advanced-security: false
