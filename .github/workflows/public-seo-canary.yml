name: SEO · Public release canary
run-name: SEO · Manual public sitemap and deployed SHA verification
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact expected production commit SHA (optional)
        required: false
        type: string
permissions:
  contents: read
jobs:
  public-seo:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
      - name: Verify public SEO, routes and deployed SHA
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: node scripts/public-seo-canary.mjs
