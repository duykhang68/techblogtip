name: SEO · Post-deploy public canary
run-name: SEO · Public sitemap, SHA and route availability
on:
  workflow_run:
    workflows: ["Deploy · GitHub Pages production"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-seo:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
      - name: Verify public SEO, routes and deployed SHA
        env:
          EXPECTED_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || '' }}
        run: node scripts/public-seo-canary.mjs
