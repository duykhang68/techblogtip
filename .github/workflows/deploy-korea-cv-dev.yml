name: Deploy · Korea CV DEV (manual)
run-name: >-
  ${{ github.ref != 'refs/heads/main'
      && format('SKIP · Korea CV requires main (got {0})', github.ref_name)
      || inputs.confirm != 'deploy-korea-cv-dev'
      && 'SKIP · Korea CV explicit approval required'
      || format('Korea CV DEV · SHA {0}', github.sha) }}
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Explicitly deploy isolated Korea CV DEV Worker
        required: true
        type: choice
        options: [deploy-korea-cv-dev]
permissions:
  contents: read
concurrency:
  group: techblogtip-korea-cv-dev
  cancel-in-progress: false
jobs:
  deploy:
    if: ${{ github.ref == 'refs/heads/main' && inputs.confirm == 'deploy-korea-cv-dev' }}
    environment: techblogtip-korea-cv-dev
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      # Same public Resume Studio Web OAuth client as the GitHub Pages frontend.
      # Do not route the Korea CV Worker through Publisher's OAuth secret.
      GOOGLE_OAUTH_CLIENT_ID: 86180355982-ucstas5q9h5j10hedc1lruo3pg4v8h5f.apps.googleusercontent.com
      ALLOWED_ORIGIN: https://duykhang68.github.io
      RELEASE_SHA: ${{ github.sha }}
      KOREA_CV_DEV_URL: https://techblogtip-korea-cv-dev.tamsudev-com.workers.dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
      - name: Fail closed on missing configuration or wrong commit
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -n "$CLOUDFLARE_API_TOKEN" || { echo '::error::Cloudflare token missing'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo '::error::Cloudflare account missing'; exit 1; }
          test -n "$GOOGLE_OAUTH_CLIENT_ID" || { echo '::error::Resume Studio Web OAuth client ID missing'; exit 1; }
      - name: Install project dependencies
        run: npm install --no-audit --no-fund
      - name: Verify private Drive API security tests
        run: node --test tests/korea-cv-worker.test.mjs tests/korea-cv-model.test.mjs
      - name: Publish isolated Korea CV DEV Worker only
        run: npx --yes wrangler@4.51.0 deploy --config workers/korea-cv/wrangler.toml --var GOOGLE_OAUTH_CLIENT_ID:"$GOOGLE_OAUTH_CLIENT_ID" --var ALLOWED_ORIGIN:"$ALLOWED_ORIGIN" --var RELEASE_SHA:"$RELEASE_SHA"
      - name: Verify public DEV Worker exact SHA and anonymous denial
        run: |
          node --input-type=module -e '
            const base=process.env.KOREA_CV_DEV_URL;
            const res=await fetch(base+"/health",{cache:"no-store"});
            if(!res.ok)throw new Error("Korea CV DEV health HTTP "+res.status);
            const body=await res.json();
            if(body.status!=="ok"||body.releaseSha!==process.env.RELEASE_SHA)
              throw new Error("Korea CV DEV exact SHA mismatch");
            const anonymous=await fetch(base+"/api/korea-cv",{headers:{Origin:"https://duykhang68.github.io"}});
            if(anonymous.status!==401)throw new Error("Anonymous CV read was not rejected: "+anonymous.status);
            console.log("Korea CV DEV exact source SHA verified, anonymous denied");
          '
      - name: Explain live acceptance gate
        run: |
          echo '### Korea CV DEV Worker deployed' >> "$GITHUB_STEP_SUMMARY"
          echo "Exact GitHub source SHA: \`$GITHUB_SHA\`" >> "$GITHUB_STEP_SUMMARY"
          echo 'Requires authenticated Google Drive save/reload/delete test and A4/PDF/XLSX QA before production activation.' >> "$GITHUB_STEP_SUMMARY"
